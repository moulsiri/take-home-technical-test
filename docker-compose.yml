version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: take_home_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: take_home_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d take_home_test"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: