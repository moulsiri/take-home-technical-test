version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: take_home_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: take_home_test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d take_home_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: apps/backend
    container_name: take_home_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/take_home_test
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: apps/web
    container_name: take_home_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3001
    depends_on:
      - backend

volumes:
  postgres_data: